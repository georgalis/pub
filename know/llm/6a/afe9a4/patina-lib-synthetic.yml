# Forms by which readers recognize model-synthesized prose. Seed entries;
# replace intuition-tier evidence in research sessions. Salience here is
# how readily a reader takes the form as a sign of synthesis.

parlance:
  name: synthetic
  title: Model-synthesized prose
  role: displace
  axes: {stance: synthesized}
  sources: [study, template]
  revised: 20260920

entries:

  - marker: "delve into"
    class: phraseological
    salience: 0.95
    steep: {attested: c19, status: longstanding}
    evidence: {source: study}
    notes: "excess-vocabulary finding; SKILL.md note 4"

